<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Integrator AI | Clinical Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: #e2e8f0;
        margin: 0;
        overflow: hidden;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-spin { animation: spin 1s linear infinite; }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
        50% { box-shadow: 0 0 35px 15px rgba(99, 102, 241, 0.25); }
      }
      .prominent-btn-glow { animation: pulse-glow 2s infinite; }
      
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
    <script>
      // Initialize environment before any modules load
      window.process = { env: { API_KEY: "" } };
      
      // Global error tracker to catch and display module resolution failures
      window.addEventListener('error', (event) => {
        console.error("Critical System Error:", event.error || event.message);
        const root = document.getElementById('root');
        if (root && (event.message.includes('import') || event.message.includes('module') || event.message.includes('React'))) {
          root.innerHTML = `
            <div style="padding: 40px; color: #f87171; background: #0f172a; border: 1px solid #1e293b; border-radius: 24px; margin: 100px auto; max-width: 500px; text-align: center; font-family: sans-serif; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);">
              <h2 style="color: white; margin-bottom: 16px; font-weight: 800; letter-spacing: -0.025em;">Neural Link Interrupted</h2>
              <p style="color: #94a3b8; font-size: 14px; line-height: 1.6;">The bio-intelligence engine failed to initialize modules.</p>
              <p style="color: #6366f1; font-size: 12px; margin-top: 10px; font-family: monospace;">${event.message}</p>
              <button onclick="location.reload()" style="margin-top: 32px; background: #6366f1; color: white; padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px;">Reconnect Engine</button>
            </div>
          `;
        }
      });
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.2",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react,react-dom",
    "recharts": "https://esm.sh/recharts@2.13.3?external=react,react-dom",
    "dicom-parser": "https://esm.sh/dicom-parser@1.8.21",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #020617; flex-direction: column;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #6366f1; border-radius: 50%;" class="loader-spin"></div>
        <p style="margin-top: 24px; letter-spacing: 0.3em; font-size: 10px; font-weight: 900; color: #6366f1; text-transform: uppercase; animation: pulse 2s infinite;">Bio-Integrator // Neural Engine Influx</p>
      </div>
    </div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
