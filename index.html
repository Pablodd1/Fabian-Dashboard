<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bio-Integrator AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: #e2e8f0; /* Slate 200 */
        margin: 0;
        overflow: hidden;
      }
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-spin { animation: spin 1s linear infinite; }
    </style>
    <!-- Robust Shim for process.env -->
    <script>
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      window.process.env.API_KEY = window.process.env.API_KEY || "";
      
      // Global error handler to help diagnose mounting issues
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Critical Launch Error:", message, error);
        const root = document.getElementById('root');
        if (root && (root.innerText.includes("Initializing") || root.innerHTML === "")) {
          root.innerHTML = `
            <div style="padding: 40px; color: #ef4444; font-family: monospace; background: #020617; height: 100vh;">
              <h3 style="font-size: 20px; margin-bottom: 10px;">Application Launch Error</h3>
              <p style="color: #94a3b8; margin-bottom: 20px;">The script failed to initialize. This usually happens if the entry point is missing or there is a module resolution error.</p>
              <div style="background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; overflow: auto;">
                <code>${message}</code>
              </div>
              <p style="margin-top: 20px; font-size: 12px; color: #475569;">Source: ${source}:${lineno}</p>
            </div>
          `;
        }
      };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "dicom-parser": "https://esm.sh/dicom-parser@^1.8.21",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="root">
      <!-- Loading Placeholder that disappears when React mounts -->
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #020617; color: #475569; font-family: sans-serif;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #1e293b; border-top-color: #6366f1; border-radius: 50%; margin: 0 auto 20px;" class="loader-spin"></div>
          <p style="letter-spacing: 0.1em; font-size: 14px; font-weight: 500; color: #94a3b8;">BIO-INTEGRATOR ENGINE INITIALIZING...</p>
        </div>
      </div>
    </div>
    <!-- Script path updated to index.tsx -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
